[package]
name = "omp-tauri"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.90"

[dependencies]
tauri = { version = "2.12.5", features = ["wry"] }
tauri-plugin-store = "2.5.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
omp-protocol = { path = "../omp-protocol" }
omp-host = { path = "../omp-host" }
libc = "0.2.191"
portable-pty = "0.9.0"
tracing = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
proptest = { workspace = true }
