[workspace]
resolver = "2"
rust-version = "1.85"
members = [
    "crates/omp-protocol",
    "crates/omp-host",
    "crates/omp-gui",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["process", "sync", "io-util", "rt-multi-thread", "macros", "time"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
bytes = "1.6"
tempfile = "3.8"
proptest = "1.3"
tracing = "0.1.40"