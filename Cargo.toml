[workspace]
resolver = "2"
rust-version = "1.90"
members = [
    "crates/omp-protocol",
    "crates/omp-host",
    "crates/omp-gui",
    "crates/omp-tauri",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["process", "sync", "io-util", "rt-multi-thread", "macros", "time", "fs", "signal"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
bytes = "1.6"
proptest = "1.3"
tempfile = "3.8"
tracing = "0.1.40"